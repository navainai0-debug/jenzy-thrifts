<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <title>My Orders | JENZY THRIFTS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
    <link rel="apple-touch-icon" href="assets/img/icon-180.png">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/store.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
</head>
<body data-page="orders">

<main class="container" style="padding-bottom:88px;min-height:60vh">
    <div class="page-head">
        <h1>My Orders</h1>
        <p>Track the status of your orders. This page updates automatically.</p>
    </div>

    <div id="placedBanner"></div>
    <div id="invite"></div>
    <div id="ordersRoot"><div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading your orders…</p></div></div>
</main>

<script src="assets/js/store.js"></script>
<script>
(function () {
    const { esc, pkr, api, orderNo } = Store;
    const $ = (id) => document.getElementById(id);
    const STEPS = ['Pending', 'Confirmed', 'Shipped', 'Delivered'];
    const STEP_LABELS = { Pending: 'Placed', Confirmed: 'Confirmed', Shipped: 'Shipped', Delivered: 'Delivered' };
    const STATUS_TEXT = {
        Pending: 'We received your order and will confirm it shortly.',
        Confirmed: 'Your order is confirmed and being packed.',
        Shipped: 'Your order is on the way.',
        Delivered: 'Delivered. Enjoy your new shoes!',
        Cancelled: 'This order was cancelled.'
    };
    const placed = Store.qs('placed');
    let pollTimer = null;
    let lastJson = '';
    let reviews = {};
    const DISCOUNT_NAMES = { bundle: 'Bundle deal', referral: 'Invite code', credit: 'Invite credit', coupon: 'Coupon' };
    const discountName = (o) => {
        const t = o.discount_type || (o.coupon ? 'coupon' : '');
        return (DISCOUNT_NAMES[t] || 'Discount') + (o.coupon && (t === 'coupon' || t === 'referral') ? ' ' + o.coupon : '');
    };

    if (placed) {
        $('placedBanner').innerHTML = `
            <div class="success-banner">
                <i class="fas fa-circle-check"></i>
                <div>
                    <h3>Thank you! Your order ${esc(orderNo(placed))} has been placed.</h3>
                    <p>We'll call you to confirm. Keep this page to track your order — you'll pay cash when it arrives.</p>
                </div>
            </div>`;
    }

    const fmtDate = (d) => new Date(d).toLocaleString('en-PK', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });

    function tracker(o) {
        if (o.status === 'Cancelled') return '';
        const idx = STEPS.indexOf(o.status);
        const when = {};
        (o.status_history || []).forEach(h => { if (h && h.status) when[h.status] = h.at; });
        if (!when.Pending) when.Pending = o.created_at;
        return `<div class="tracker">${STEPS.map((s, i) => `
            <div class="t-step ${i <= idx ? 'done' : ''}">
                <div class="t-dot">${i <= idx ? '<i class="fas fa-check"></i>' : i + 1}</div>
                <div>${STEP_LABELS[s]}</div>
                ${i <= idx && when[s] ? `<div class="muted" style="font-size:11px">${new Date(when[s]).toLocaleDateString('en-PK', { day: 'numeric', month: 'short' })}</div>` : ''}
            </div>`).join('')}</div>`;
    }

    function trackBox(o) {
        if (o.status === 'Cancelled' || (!o.tracking_no && !o.courier)) return '';
        return `
            <div class="track-box">
                <h5><i class="fas fa-truck-fast"></i> Track your parcel</h5>
                ${o.courier ? `<div class="t-courier">Courier: <strong>${esc(o.courier)}</strong></div>` : ''}
                ${o.tracking_no ? `<div class="t-no">${esc(o.tracking_no)}</div>` : ''}
                <div class="t-actions">
                    ${o.tracking_link ? `<a class="btn btn-primary btn-sm" href="${esc(o.tracking_link)}" target="_blank" rel="noopener"><i class="fas fa-location-dot"></i> Track parcel</a>` : ''}
                    ${o.tracking_no ? `<button class="btn btn-outline btn-sm" type="button" data-copy="${esc(o.tracking_no)}"><i class="fas fa-copy"></i> Copy number</button>` : ''}
                </div>
            </div>`;
    }

    function orderCard(o) {
        const items = Array.isArray(o.items) ? o.items : [];
        const highlight = placed && String(o.order_no) === String(placed);
        return `
        <article class="order-card" ${highlight ? 'style="border-color:rgba(57,255,20,.45)"' : ''}>
            <div class="order-head">
                <div>
                    <div class="o-no">Order ${esc(orderNo(o.order_no))}</div>
                    <div class="o-date">${fmtDate(o.created_at)} • ${items.length} ${items.length === 1 ? 'item' : 'items'}</div>
                </div>
                <span class="status-pill st-${esc(o.status)}"><i class="fas fa-circle" style="font-size:7px"></i>${esc(o.status)}</span>
            </div>
            ${tracker(o)}
            ${o.status === 'Cancelled' ? `<div class="cancelled-note" style="margin-top:18px">${STATUS_TEXT.Cancelled}</div>` : ''}
            <div class="order-body">
                <div class="order-items">
                    ${items.map(it => `
                        <div class="sum-item">
                            <a href="${Store.productUrl(it.product_id)}"><img src="${esc(it.image || Store.firstImage({}))}" alt=""></a>
                            <div><h5>${esc(it.name)}</h5><small>${esc(it.brand || '')} • US ${esc(it.size)}</small></div>
                            <span class="price">${pkr(it.price)}</span>
                        </div>`).join('')}
                </div>
                <div class="order-side">
                    <div class="block"><h5>Status</h5><p>${esc(STATUS_TEXT[o.status] || o.status)}</p>${trackBox(o)}</div>
                    <div class="block"><h5>Deliver to</h5><p>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city)}</p></div>
                    <div class="block">
                        <h5>Payment • Cash on Delivery</h5>
                        <div class="sum-row"><span>Subtotal</span><span>${pkr(o.subtotal)}</span></div>
                        ${o.discount ? `<div class="sum-row"><span>${esc(discountName(o))}</span><span>− ${pkr(o.discount)}</span></div>` : ''}
                        <div class="sum-row"><span>Delivery</span><span>${o.delivery_fee ? pkr(o.delivery_fee) : 'Free'}</span></div>
                        <div class="sum-row total"><span>Total</span><span>${pkr(o.total)}</span></div>
                    </div>
                    ${o.status === 'Pending' ? `<button class="btn btn-danger btn-sm" data-cancel="${esc(o.id)}" data-no="${esc(o.order_no)}" style="margin-top:14px"><i class="fas fa-xmark"></i> Cancel order</button>` : ''}
                </div>
            </div>
            ${o.status === 'Delivered' ? reviewBox(o) : ''}
        </article>`;
    }

    // ---------- Reviews (delivered orders only; shown after the shop approves) ----------
    function reviewBox(o) {
        const r = reviews[o.id];
        if (r) {
            return `<div class="review-box done"><span class="stars">${Store.stars(r.rating)}</span>
                <span>${r.status === 'Approved' ? 'Thank you! Your review is live on our website.' : r.status === 'Hidden' ? 'Thank you for your review!' : 'Thank you! Your review will appear after we check it.'}</span></div>`;
        }
        return `
            <div class="review-box" data-review="${esc(o.id)}">
                <button class="btn btn-outline btn-sm rv-open" type="button"><i class="fa-regular fa-star"></i> Rate your order</button>
                <form class="review-form" hidden>
                    <h5>How were your shoes?</h5>
                    <div class="star-input" role="radiogroup" aria-label="Rating">
                        ${[1, 2, 3, 4, 5].map(n => `<button type="button" data-star="${n}" aria-label="${n} star${n > 1 ? 's' : ''}"><i class="fa-regular fa-star"></i></button>`).join('')}
                    </div>
                    <textarea class="input" maxlength="1000" rows="3" placeholder="Tell other buyers about the quality, fit and delivery (optional)"></textarea>
                    <div class="rv-photos">
                        <label class="rv-add"><input type="file" accept="image/*" multiple hidden><i class="fas fa-camera"></i><span>Add photos</span></label>
                        <div class="rv-previews"></div>
                    </div>
                    <p class="field-hint">Up to 3 photos of your pair. Your first name, last initial and city are shown with the review.</p>
                    <div class="alert rv-alert"></div>
                    <button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane"></i> Send review</button>
                </form>
            </div>`;
    }
    function bindReviews(root) {
        root.querySelectorAll('[data-review]').forEach(box => {
            const form = box.querySelector('form');
            let rating = 0;
            const files = [];
            box.querySelector('.rv-open').addEventListener('click', e => { e.currentTarget.hidden = true; form.hidden = false; });
            const paint = (n) => box.querySelectorAll('[data-star]').forEach(b => {
                b.querySelector('i').className = (Number(b.dataset.star) <= n ? 'fas' : 'fa-regular') + ' fa-star';
                b.classList.toggle('on', Number(b.dataset.star) <= n);
            });
            box.querySelectorAll('[data-star]').forEach(b => {
                b.addEventListener('click', () => { rating = Number(b.dataset.star); paint(rating); });
                b.addEventListener('mouseenter', () => paint(Number(b.dataset.star)));
                b.addEventListener('mouseleave', () => paint(rating));
            });
            const input = box.querySelector('input[type=file]');
            const previews = box.querySelector('.rv-previews');
            const renderPreviews = () => {
                previews.innerHTML = files.map((f, i) => `<span class="rv-prev"><img src="${URL.createObjectURL(f)}" alt=""><button type="button" data-rm="${i}" aria-label="Remove photo">&times;</button></span>`).join('');
                previews.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { files.splice(Number(b.dataset.rm), 1); renderPreviews(); }));
                box.querySelector('.rv-add').hidden = files.length >= 3;
            };
            input.addEventListener('change', () => {
                [...input.files].forEach(f => { if (files.length < 3) files.push(f); });
                input.value = '';
                renderPreviews();
            });
            form.addEventListener('submit', async e => {
                e.preventDefault();
                const alertBox = box.querySelector('.rv-alert');
                const btn = form.querySelector('[type=submit]');
                const text = form.querySelector('textarea').value.trim();
                alertBox.className = 'alert rv-alert';
                if (!rating) { alertBox.textContent = 'Please tap the stars to rate your order.'; alertBox.className = 'alert rv-alert show'; return; }
                if (rating <= 3 && text.length < 5) { alertBox.textContent = 'Please tell us a little about what went wrong, so we can do better.'; alertBox.className = 'alert rv-alert show'; return; }
                btn.disabled = true;
                try {
                    const images = [];
                    for (let i = 0; i < files.length; i++) {
                        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Uploading photo ${i + 1} of ${files.length}…`;
                        images.push(await Store.uploadPhoto('reviews', files[i]));
                    }
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';
                    await api('/api/orders?action=review', { method: 'POST', auth: true, body: { order_id: box.dataset.review, rating, text, images } });
                    reviews[box.dataset.review] = { rating, status: 'Pending' };
                    box.outerHTML = reviewBox({ id: box.dataset.review });
                    Store.toast('Thank you for your review!');
                } catch (err) {
                    alertBox.textContent = err.message;
                    alertBox.className = 'alert rv-alert show';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send review';
                }
            });
        });
    }

    // ---------- Invite friends ----------
    async function loadInvite(create) {
        const box = $('invite');
        try {
            const info = await api('/api/orders?action=referral', { method: create ? 'POST' : 'GET', auth: true });
            renderInvite(info);
        } catch (e) {
            if (create) Store.toast(e.message, 'error');
            else box.innerHTML = '';
        }
    }
    function renderInvite(info) {
        const box = $('invite');
        const o = info.offer;
        if (!info.code && !o.active) { box.innerHTML = ''; return; }
        const link = info.code ? `${location.origin}/?ref=${encodeURIComponent(info.code)}` : '';
        const waText = info.code ? `Get ${o.percent}% off your first pair of original sneakers at JENZY THRIFTS with my code ${info.code} 👟\n${link}&s=wa` : '';
        box.innerHTML = `
            <section class="invite-card">
                <div class="invite-main">
                    <div class="invite-icon"><i class="fas fa-gift"></i></div>
                    <div>
                        <h3>Invite friends, get ${pkr(o.reward)} off</h3>
                        <p>Your friend gets <strong>${o.percent}% off</strong> their first order. When it's delivered, you get <strong>${pkr(o.reward)} off</strong> your next order.</p>
                    </div>
                </div>
                ${info.code ? `
                    <div class="invite-code-row">
                        <div class="invite-code" id="inviteCode">${esc(info.code)}</div>
                        <button class="btn btn-outline btn-sm" type="button" id="copyCode"><i class="fas fa-copy"></i> Copy code</button>
                        <button class="btn btn-outline btn-sm" type="button" id="copyInvite"><i class="fas fa-link"></i> Copy link</button>
                        <a class="btn btn-primary btn-sm wa-btn" id="waInvite" href="https://wa.me/?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Share on WhatsApp</a>
                    </div>
                    <div class="invite-stats">
                        <div><strong>${info.friends}</strong><span>friend${info.friends === 1 ? '' : 's'} ordered</span></div>
                        <div><strong>${info.friendsDelivered}</strong><span>delivered</span></div>
                        <div class="${info.balance ? 'hl' : ''}"><strong>${pkr(info.balance)}</strong><span>credit to use</span></div>
                    </div>
                    ${info.balance ? '<p class="invite-note"><i class="fas fa-circle-info"></i> Your credit is applied automatically at checkout (only the biggest discount is used per order).</p>' : ''}
                ` : `<button class="btn btn-primary" type="button" id="makeCode"><i class="fas fa-wand-magic-sparkles"></i> Get my invite code</button>`}
            </section>`;
        $('makeCode')?.addEventListener('click', e => { e.currentTarget.disabled = true; loadInvite(true); });
        $('copyCode')?.addEventListener('click', () => Store.copyText(info.code, 'Code copied'));
        $('copyInvite')?.addEventListener('click', () => Store.copyText(link, 'Invite link copied'));
        if (location.hash === '#invite' && !renderInvite.scrolled) {
            renderInvite.scrolled = true;
            box.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    async function load(silent) {
        if (!Store.user) return;
        try {
            const res = await api('/api/orders?action=mine', { auth: true });
            const orders = res.orders;
            const json = JSON.stringify(res);
            if (silent && json === lastJson) return;
            // Don't wipe a review the customer is writing
            if (silent && [...document.querySelectorAll('.review-form')].some(f => !f.hidden)) return;
            lastJson = json;
            reviews = res.reviews || {};
            if (!orders.length) {
                $('ordersRoot').innerHTML = `
                    <div class="gate">
                        <div class="gate-icon"><i class="fas fa-box-open"></i></div>
                        <h2>No orders yet</h2>
                        <p>When you place an order it will show up here, and you can track it live.</p>
                        <a href="index.html#shop" class="btn btn-primary btn-lg">Start shopping</a>
                    </div>`;
                return;
            }
            $('ordersRoot').innerHTML = orders.map(orderCard).join('');
            $('ordersRoot').querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => cancel(b)));
            $('ordersRoot').querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => Store.copyText(b.dataset.copy, 'Tracking number copied')));
            bindReviews($('ordersRoot'));
        } catch (e) {
            if (!silent) $('ordersRoot').innerHTML = `<div class="alert show">${esc(e.message)}</div>`;
        }
    }

    async function cancel(btn) {
        if (!confirm(`Cancel order ${orderNo(btn.dataset.no)}?`)) return;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cancelling…';
        try {
            await api('/api/orders?action=cancel', { method: 'POST', auth: true, body: { id: btn.dataset.cancel } });
            Store.toast(`Order ${orderNo(btn.dataset.no)} cancelled`);
            await load(false);
        } catch (e) {
            Store.toast(e.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-xmark"></i> Cancel order';
        }
    }

    Store.onAuth(user => {
        clearInterval(pollTimer);
        lastJson = '';
        if (!user) {
            $('invite').innerHTML = '';
            $('ordersRoot').innerHTML = `
                <div class="gate">
                    <div class="gate-icon"><i class="fas fa-user-lock"></i></div>
                    <h2>Log in to see your orders</h2>
                    <p>Your orders are saved to your account.</p>
                    <button class="btn btn-primary btn-lg" id="ordersLogin"><i class="fa-regular fa-user"></i> Login</button>
                </div>`;
            $('ordersLogin').addEventListener('click', () => Store.requireLogin('Log in to see your orders.').catch(() => {}));
            return;
        }
        $('ordersRoot').innerHTML = '<div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading your orders…</p></div>';
        load(false);
        loadInvite(false);
        pollTimer = setInterval(() => { if (!document.hidden) load(true); }, 20000);
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
})();
</script>
</body>
</html>

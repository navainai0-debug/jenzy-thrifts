<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <title>Shoe details | JENZY THRIFTS</title>
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
    <link rel="apple-touch-icon" href="assets/img/icon-180.png">
    <meta name="description" content="Authentic thrifted sneakers — see photos, condition, sizes and price. Cash on delivery across Pakistan.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/store.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
</head>
<body data-page="shop">

<main class="container">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><i class="fas fa-chevron-right"></i><a href="index.html#shop">Shop</a>
    </nav>

    <div id="productRoot">
        <div class="pd-grid">
            <div class="skeleton" style="aspect-ratio:1/1"></div>
            <div>
                <div class="skeleton" style="height:22px;width:30%;margin-bottom:14px"></div>
                <div class="skeleton" style="height:40px;width:85%;margin-bottom:24px"></div>
                <div class="skeleton" style="height:60px;margin-bottom:24px"></div>
                <div class="skeleton" style="height:120px"></div>
            </div>
        </div>
    </div>
</main>

<section class="related container" id="relatedSection" hidden>
    <div class="related-head">
        <div>
            <span class="eyebrow">You may also like</span>
            <h2 class="section-title">More <span class="grad">shoes</span></h2>
        </div>
        <a href="index.html#shop" class="btn btn-outline btn-sm">View all <i class="fas fa-arrow-right"></i></a>
    </div>
    <div class="p-grid" id="relatedGrid"></div>
</section>

<section class="recent-section container" id="recentSection" hidden>
    <div class="related-head">
        <div>
            <span class="eyebrow">Your history</span>
            <h2 class="section-title">Recently <span class="grad">viewed</span></h2>
        </div>
    </div>
    <div class="p-grid" id="recentGrid"></div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="icon-btn lb-close" id="lbClose" aria-label="Close"><i class="fas fa-xmark"></i></button>
    <button class="lb-nav prev" id="lbPrev" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
    <img id="lbImg" alt="">
    <button class="lb-nav next" id="lbNext" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
    <span class="lb-count" id="lbCount"></span>
</div>

<script src="assets/js/store.js"></script>
<script>
(function () {
    const { db, esc, pkr, sortSizes, discountPct, productCard } = Store;
    const $ = (id) => document.getElementById(id);
    // Works for both /shoe/<id> (share links) and product.html?id=<id>
    const id = Store.qs('id') || (location.pathname.match(/\/shoe\/([^/?#]+)/) || [])[1] || '';
    const root = $('productRoot');

    let product = null;
    let selectedSize = null;
    let imageIndex = 0;
    let images = [];
    let notifyOpen = false;
    // Shoes seen before this one (this shoe is added once it loads)
    const recentBefore = Store.recent.ids().filter(x => x !== id).slice(0, 4);
    const ALL_SIZES = ['3', '3.5', '4', '4.5', '5', '5.5', '6', '6.5', '7', '7.5', '8', '8.5', '9', '9.5', '10', '10.5', '11', '11.5', '12', '12.5', '13', '14', '15'];
    const NOTIFY_KEY = 'jenzyNotify.v1';
    const notified = () => { try { return JSON.parse(localStorage.getItem(NOTIFY_KEY)) || []; } catch { return []; } };

    const CONDITION_NOTES = {
        Excellent: 'Barely worn — looks almost new, minimal signs of use.',
        Good: 'Lightly worn — small signs of use, no major flaws.',
        Fair: 'Visibly worn — still very wearable, priced accordingly.'
    };

    function notFound(message) {
        document.getElementById('buyBar')?.remove();
        document.body.classList.remove('has-buybar');
        document.title = 'Shoe not found | JENZY THRIFTS';
        root.innerHTML = `
            <div class="gate">
                <div class="gate-icon"><i class="fas fa-shoe-prints"></i></div>
                <h2>${esc(message || 'This shoe is no longer available')}</h2>
                <p>It may have been sold or removed. Take a look at our other pairs below.</p>
                <a href="index.html#shop" class="btn btn-primary btn-lg">Browse all shoes</a>
            </div>`;
    }

    async function load(isRefresh) {
        if (!id) { notFound('No shoe selected'); loadRelated(); return; }
        if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) { notFound(); loadRelated(); return; }
        const { data, error } = await db.from('products').select('*').eq('id', id).maybeSingle();
        if (error && !data) {
            console.error(error);
            if (!isRefresh) { notFound("Couldn't load this shoe"); loadRelated(); }
            return;
        }
        if (!data) { notFound(); loadRelated(); return; }
        const firstLoad = !product;
        product = data;
        if (selectedSize && !(product.sizes || []).includes(selectedSize)) selectedSize = null;
        render();
        if (firstLoad) {
            loadRelated();
            Store.recent.add(product.id);
        }
    }

    function render() {
        const p = product;
        images = (p.images && p.images.length) ? p.images : [Store.firstImage(p)];
        imageIndex = Math.min(imageIndex, images.length - 1);
        const sizes = sortSizes(p.sizes);
        const off = discountPct(p);
        const sold = p.status !== 'Active' || !sizes.length;
        if (sizes.length === 1 && !sold) selectedSize = sizes[0];

        document.title = `${p.name} | JENZY THRIFTS`;
        $('breadcrumb').innerHTML = `<a href="index.html">Home</a><i class="fas fa-chevron-right"></i><a href="index.html#shop">Shop</a>` +
            (p.gender === 'Men' || p.gender === 'Women' ? `<i class="fas fa-chevron-right"></i><a href="index.html?gender=${p.gender}#shop">${p.gender}</a>` : '') +
            `<i class="fas fa-chevron-right"></i><span>${esc(p.name)}</span>`;

        const specs = [
            ['Brand', p.brand], ['Category', p.category], ['For', p.gender], ['Color', p.color],
            ['Condition', p.condition], ['Available sizes', sizes.length ? 'US ' + sizes.join(', ') : 'Sold out'],
            ['Retail price', p.original_price && p.original_price > p.price ? pkr(p.original_price) : '']
        ].filter(([, v]) => v);

        root.innerHTML = `
        <div class="pd-grid">
            <div class="gallery">
                <div class="gallery-main zoomable" id="galleryMain">
                    <img id="mainImage" src="${esc(images[imageIndex])}" alt="${esc(p.name)}">
                    ${Store.wishlist.button(p.id, 'wish-lg')}
                    <span class="zoom-hint"><i class="fas fa-magnifying-glass-plus"></i><span class="mouse-only">Hover to zoom</span><span class="touch-only">Tap to enlarge</span></span>
                    ${images.length > 1 ? `
                        <button class="gallery-nav prev" id="prevImg" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
                        <button class="gallery-nav next" id="nextImg" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
                        <span class="gallery-count" id="imgCount">${imageIndex + 1} / ${images.length}</span>` : ''}
                    <div class="p-badges">
                        ${sold ? '<span class="badge badge-sold">Sold out</span>' : ''}
                        ${!sold && p.tag ? `<span class="badge badge-${esc(p.tag.toLowerCase())}">${esc(p.tag)}</span>` : ''}
                    </div>
                </div>
                ${images.length > 1 ? `<div class="thumbs">${images.map((src, i) => `<button class="${i === imageIndex ? 'active' : ''}" data-img="${i}" aria-label="Photo ${i + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
            </div>

            <div class="pd-info">
                ${p.brand ? `<a class="p-brand" href="index.html?brand=${encodeURIComponent(p.brand)}#shop">${esc(p.brand)}</a>` : ''}
                <h1 class="pd-title">${esc(p.name)}</h1>
                <div class="pd-tags">
                    ${p.condition ? `<span class="cond cond-${esc(p.condition)}">${esc(p.condition)} condition</span>` : ''}
                    ${p.gender ? `<span class="cond" style="border:1px solid var(--border-2);color:var(--text-2)">${esc(p.gender)}</span>` : ''}
                    ${p.category ? `<span class="cond" style="border:1px solid var(--border-2);color:var(--text-2)">${esc(p.category)}</span>` : ''}
                </div>
                <div class="pd-price">
                    <span class="now">${pkr(p.price)}</span>
                    ${off > 0 ? `<span class="was">${pkr(p.original_price)}</span><span class="save">Save ${off}%</span>` : ''}
                </div>

                ${sold ? `
                    <div class="pd-soldout"><i class="fas fa-circle-xmark"></i> This pair has been sold. Check out similar shoes below.</div>
                    ${notifyBox(p, sizes, true)}
                ` : `
                    <div class="pd-block">
                        <div class="pd-block-head"><h4>Select size (US)</h4><span>${sizes.length === 1 ? 'Only 1 size available' : sizes.length + ' sizes available'}</span></div>
                        <div class="size-grid" id="sizeGrid">
                            ${sizes.map(s => `<button class="size-opt ${s === selectedSize ? 'active' : ''}" data-size="${esc(s)}">${esc(s)}</button>`).join('')}
                        </div>
                        <div class="size-error" id="sizeError">Please select a size first.</div>
                        <button class="link-btn" id="notifyToggle" type="button" aria-expanded="${notifyOpen}"><i class="fa-regular fa-bell"></i> Your size not here? Get notified when it arrives</button>
                        <div id="notifyWrap" ${notifyOpen ? '' : 'hidden'}>${notifyBox(p, sizes, false)}</div>
                    </div>
                    <div class="pd-actions">
                        <button class="btn btn-outline btn-lg" id="addToCart"><i class="fas fa-bag-shopping"></i> Add to Cart</button>
                        <button class="btn btn-primary btn-lg" id="buyNow"><i class="fas fa-bolt"></i> Buy Now</button>
                    </div>
                `}

                <div class="pd-share">
                    <span>Share</span>
                    <a class="share-btn wa" id="shareWa" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                    <button class="share-btn" id="shareCopy" type="button"><i class="fas fa-link"></i> Copy link</button>
                    <button class="share-btn" id="shareMore" type="button" hidden><i class="fas fa-share-nodes"></i> More</button>
                    <button class="share-btn wish-share" type="button" data-wish="${esc(p.id)}"><i class="${Store.wishlist.has(p.id) ? 'fas' : 'fa-regular'} fa-heart"></i> <span data-wish-label>${Store.wishlist.has(p.id) ? 'Saved' : 'Save'}</span></button>
                </div>

                <ul class="pd-perks">
                    <li><i class="fas fa-certificate"></i>100% authentic — checked before listing</li>
                    <li><i class="fas fa-money-bill-wave"></i>Cash on delivery — pay when it arrives</li>
                    <li><i class="fas fa-truck-fast"></i>Delivery across Pakistan</li>
                    <li><i class="fas fa-gem"></i>One of a kind — only one pair per size</li>
                </ul>

                ${p.condition ? `
                <div class="pd-block">
                    <div class="pd-block-head"><h4>Condition: ${esc(p.condition)}</h4></div>
                    <p class="cond-note">${esc(CONDITION_NOTES[p.condition] || '')}</p>
                </div>` : ''}

                ${p.description ? `
                <div class="pd-block">
                    <div class="pd-block-head"><h4>Description</h4></div>
                    <p class="pd-desc">${esc(p.description)}</p>
                </div>` : ''}

                <div class="pd-block">
                    <div class="pd-block-head"><h4>Details</h4></div>
                    <table class="spec-table"><tbody>
                        ${specs.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}
                    </tbody></table>
                </div>
            </div>
        </div>`;

        // Gallery
        const show = (i) => {
            imageIndex = (i + images.length) % images.length;
            $('mainImage').src = images[imageIndex];
            if ($('imgCount')) $('imgCount').textContent = `${imageIndex + 1} / ${images.length}`;
            root.querySelectorAll('.thumbs button').forEach((b, j) => b.classList.toggle('active', j === imageIndex));
        };
        $('prevImg')?.addEventListener('click', () => show(imageIndex - 1));
        $('nextImg')?.addEventListener('click', () => show(imageIndex + 1));
        root.querySelectorAll('.thumbs button').forEach(b => b.addEventListener('click', () => show(Number(b.dataset.img))));
        let touchX = null;
        const gm = root.querySelector('.gallery-main');
        // Magnifier: move the mouse over the photo to zoom in on that spot
        const mainImg = $('mainImage');
        const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        gm.addEventListener('mousemove', e => {
            if (!canHover || e.target.closest('button')) { gm.classList.remove('zooming'); return; }
            const r = gm.getBoundingClientRect();
            const x = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
            const y = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
            mainImg.style.transformOrigin = `${x}% ${y}%`;
            gm.classList.add('zooming');
        });
        gm.addEventListener('mouseleave', () => gm.classList.remove('zooming'));
        // Click / tap: full-screen photo viewer
        gm.addEventListener('click', e => {
            if (e.target.closest('button')) return;
            openLightbox(imageIndex);
        });
        gm.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
        gm.addEventListener('touchend', e => {
            if (touchX === null || images.length < 2) return;
            const dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 40) show(imageIndex + (dx < 0 ? 1 : -1));
            touchX = null;
        });

        // Share (WhatsApp, copy link, phone share sheet)
        const link = Store.shareUrl(p);
        const shareText = `${p.brand && !p.name.toLowerCase().startsWith(p.brand.toLowerCase()) ? p.brand + ' ' : ''}${p.name} — ${pkr(p.price)}${sold ? ' (sold)' : ''} at JENZY THRIFTS`;
        $('shareWa').href = 'https://wa.me/?text=' + encodeURIComponent(`${shareText}\n${link}`);
        $('shareCopy').addEventListener('click', () => Store.copyText(link, 'Link copied — paste it anywhere to share'));
        if (navigator.share) {
            $('shareMore').hidden = false;
            $('shareMore').addEventListener('click', () => navigator.share({ title: shareText, text: shareText, url: link }).catch(() => {}));
        }

        Store.setHelpMessage(`Hi JENZY THRIFTS! I have a question about ${shareText.replace(' at JENZY THRIFTS', '')}\n${link}`);
        bindNotify(p);
        renderBuyBar(sold);
        if (sold) return;

        // Sizes
        root.querySelectorAll('.size-opt').forEach(b => b.addEventListener('click', () => {
            selectedSize = b.dataset.size;
            root.querySelectorAll('.size-opt').forEach(x => x.classList.toggle('active', x === b));
            $('sizeError').classList.remove('show');
            updateBuyBar();
        }));
        const needSize = () => {
            if (selectedSize) return false;
            $('sizeError').classList.add('show');
            $('sizeGrid').scrollIntoView({ behavior: 'smooth', block: 'center' });
            return true;
        };
        const addToCart = () => {
            if (needSize()) return;
            if (Store.cart.add(p, selectedSize)) Store.cart.open();
        };
        const buyNow = () => {
            if (needSize()) return;
            location.href = `checkout.html?buy=${encodeURIComponent(p.id)}&size=${encodeURIComponent(selectedSize)}`;
        };
        $('addToCart').addEventListener('click', addToCart);
        $('buyNow').addEventListener('click', buyNow);
        $('bbCart').addEventListener('click', addToCart);
        $('bbBuy').addEventListener('click', buyNow);
    }

    // ---------- "Notify me when my size arrives" ----------
    function notifyBox(p, sizes, sold) {
        const mine = notified().filter(k => k.startsWith(p.id + '|')).map(k => k.split('|')[1]);
        const options = ALL_SIZES.filter(s => !(!sold && sizes.includes(s)));
        return `
            <div class="notify-box" id="notifyBox">
                <h4><i class="fas fa-bell"></i> ${sold ? 'Want this shoe in your size?' : 'Need a different size?'}</h4>
                <p>Tell us your size. We'll email you as soon as a pair in that size arrives.${mine.length ? ` <strong style="color:var(--accent)">You're on the list for US ${esc(mine.join(', '))}.</strong>` : ''}</p>
                <div class="notify-form" id="notifyForm">
                    <select class="select" id="nfSize" aria-label="Your US size">
                        <option value="">Your size</option>
                        ${options.map(s => `<option value="${s}">US ${s}</option>`).join('')}
                    </select>
                    <input class="input" id="nfPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="WhatsApp (optional)" aria-label="WhatsApp number (optional)">
                    <button class="btn btn-primary" id="nfBtn" type="button"><i class="fas fa-bell"></i> Notify me</button>
                </div>
                <div class="alert" id="nfAlert"></div>
            </div>`;
    }
    function bindNotify(p) {
        $('notifyToggle')?.addEventListener('click', () => {
            notifyOpen = !notifyOpen;
            $('notifyWrap').hidden = !notifyOpen;
            $('notifyToggle').setAttribute('aria-expanded', String(notifyOpen));
            if (notifyOpen) $('nfSize').focus({ preventScroll: true });
        });
        const btn = $('nfBtn');
        if (!btn) return;
        btn.addEventListener('click', async () => {
            const alertBox = $('nfAlert');
            alertBox.className = 'alert';
            const size = $('nfSize').value;
            if (!size) { alertBox.textContent = 'Please choose your size.'; alertBox.className = 'alert show'; return; }
            try {
                await Store.requireLogin('Log in so we can email you when your size arrives.');
            } catch { return; }
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
            try {
                const res = await Store.api('/api/orders?action=notify', { method: 'POST', auth: true, body: { product_id: p.id, size, phone: $('nfPhone').value.trim() } });
                const list = notified();
                if (!list.includes(p.id + '|' + size)) { list.push(p.id + '|' + size); localStorage.setItem(NOTIFY_KEY, JSON.stringify(list.slice(-100))); }
                $('notifyForm').outerHTML = `<div class="notify-done"><i class="fas fa-circle-check"></i><span>${res.already ? 'You were already on the list' : "Done! You're on the list"} for <strong>US ${esc(size)}</strong>. We'll email <strong>${esc(Store.user?.email || 'you')}</strong> as soon as it arrives.</span></div>`;
                Store.toast('We will tell you when your size arrives');
            } catch (e) {
                alertBox.textContent = e.message;
                alertBox.className = 'alert show';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-bell"></i> Notify me';
            }
        });
    }

    // ---------- Full-screen photo viewer ----------
    let lbIndex = 0;
    function showLightbox(i) {
        lbIndex = (i + images.length) % images.length;
        const img = $('lbImg');
        img.classList.remove('zoomed');
        img.src = images[lbIndex];
        img.alt = product ? product.name : '';
        $('lbCount').textContent = images.length > 1 ? `${lbIndex + 1} / ${images.length}` : '';
        $('lbPrev').hidden = $('lbNext').hidden = images.length < 2;
    }
    function openLightbox(i) {
        showLightbox(i);
        $('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        $('lightbox').classList.remove('open');
        document.body.style.overflow = '';
    }
    $('lbClose').addEventListener('click', closeLightbox);
    $('lbPrev').addEventListener('click', () => showLightbox(lbIndex - 1));
    $('lbNext').addEventListener('click', () => showLightbox(lbIndex + 1));
    $('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
    $('lbImg').addEventListener('click', e => {
        const img = e.currentTarget;
        const r = img.getBoundingClientRect();
        img.style.transformOrigin = `${(e.clientX - r.left) / r.width * 100}% ${(e.clientY - r.top) / r.height * 100}%`;
        img.classList.toggle('zoomed');
    });
    document.addEventListener('keydown', e => {
        if (!$('lightbox').classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showLightbox(lbIndex - 1);
        if (e.key === 'ArrowRight') showLightbox(lbIndex + 1);
    });
    let lbTouchX = null;
    $('lightbox').addEventListener('touchstart', e => { lbTouchX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    $('lightbox').addEventListener('touchend', e => {
        if (lbTouchX === null || images.length < 2 || $('lbImg').classList.contains('zoomed')) return;
        const dx = e.changedTouches[0].clientX - lbTouchX;
        if (Math.abs(dx) > 50) showLightbox(lbIndex + (dx < 0 ? 1 : -1));
        lbTouchX = null;
    });

    // ---------- Recently viewed ----------
    async function loadRecent() {
        if (!recentBefore.length) return;
        const list = await Store.loadProductsByIds(recentBefore);
        if (!list.length) return;
        $('recentGrid').innerHTML = list.map(productCard).join('');
        $('recentSection').hidden = false;
    }
    loadRecent();

    // Sticky bar at the bottom of the screen on phones
    function renderBuyBar(sold) {
        document.getElementById('buyBar')?.remove();
        document.body.classList.toggle('has-buybar', !sold);
        if (sold) return;
        document.body.insertAdjacentHTML('beforeend', `
            <div class="buy-bar" id="buyBar">
                <div class="bb-price"><strong>${pkr(product.price)}</strong><span id="bbSize"></span></div>
                <button class="btn btn-outline" id="bbCart" aria-label="Add to cart"><i class="fas fa-bag-shopping"></i></button>
                <button class="btn btn-primary" id="bbBuy"><i class="fas fa-bolt"></i> Buy Now</button>
            </div>`);
        updateBuyBar();
    }
    function updateBuyBar() {
        const el = document.getElementById('bbSize');
        if (el) el.textContent = selectedSize ? `Size US ${selectedSize}` : 'Select a size';
    }

    async function loadRelated() {
        const { data } = await db.from('products').select('*').eq('status', 'Active')
            .order('created_at', { ascending: false }).limit(40);
        let list = (data || []).filter(x => x.id !== id);
        if (!list.length) return;
        // Prefer same brand / same gender, then the rest
        const score = (x) => (product && x.brand && x.brand === product.brand ? 2 : 0) + (product && x.gender === product.gender ? 1 : 0);
        list = list.map((x, i) => ({ x, s: score(x), i })).sort((a, b) => b.s - a.s || a.i - b.i).map(o => o.x).slice(0, 4);
        $('relatedGrid').innerHTML = list.map(productCard).join('');
        $('relatedSection').hidden = false;
    }

    load(false);

    // Live: if this pair sells or the price changes, update the page
    let t;
    Store.onProductsChange(payload => {
        const changedId = (payload.new && payload.new.id) || (payload.old && payload.old.id);
        if (changedId && changedId !== id) return;
        clearTimeout(t); t = setTimeout(() => load(true), 300);
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && product) load(true); });
})();
</script>
